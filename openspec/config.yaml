schema: spec-driven

context: |
  Proyecto académico: API REST de gestión de reservas de espacios académicos.
  Fuente de verdad: PLAN_INGENIERIA.md en la raíz. No contradecirlo.
  Stack: Python, FastAPI, SQLAlchemy, PostgreSQL (Docker Compose), JWT, pytest.
  Arquitectura: monolito modular en capas (rutas, servicios, acceso a datos).
  Las reglas de negocio viven en la capa de servicios.
  Módulos: usuarios y autenticación, espacios, reservas, aprobaciones.
  Roles: Solicitante, Coordinador, Administrador.
  Estados de reserva: pendiente, aprobada, rechazada, cancelada.
  Solo pendiente y aprobada bloquean el horario.
  Fuera de alcance: interfaz gráfica, notificaciones, reservas recurrentes.
  Idioma: redacta en español y conserva en inglés las palabras clave
  de OpenSpec (SHALL, WHEN, THEN).

rules:
  specs:
    - Cada requisito debe tener al menos un escenario verificable.
    - No inventes reglas ni funciones que no estén en PLAN_INGENIERIA.md;
      si algo es ambiguo, anótalo como pregunta abierta.
  tasks:
    - Cada tarea debe indicar qué prueba automatizada la verifica.
